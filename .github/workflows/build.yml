name: Build Corz Cheat Client
on:
  workflow_dispatch:
  push:
    paths:
      - 'source-chunks/**'
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Restore original project source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f build.gradle ]; then
            cat source-chunks/*.b64 | base64 --decode > /tmp/corz-client-source.tar.xz
            echo "8e9f9ee4c4362a82b34f58400ac7487a084742bd754d6083fcb73163336d8940  /tmp/corz-client-source.tar.xz" | sha256sum -c -
            tar -xJf /tmp/corz-client-source.tar.xz
          fi
          sed -i 's/1\.16-SNAPSHOT/1.18-SNAPSHOT/g' build.gradle
          sed -i 's/loader_version=0.18.4/loader_version=0.19.5/g' gradle.properties
      - name: Import extracted sources into GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .gitignore LICENSE README.md build.gradle settings.gradle gradle.properties src examples
          if ! git diff --cached --quiet; then
            git commit -m "Import original Corz client project source"
            git push
          fi
      - name: Compile Fabric mod
        run: gradle build --no-daemon
      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: corz-cheat-client-26.1.2
          path: build/libs/*.jar
          if-no-files-found: error
