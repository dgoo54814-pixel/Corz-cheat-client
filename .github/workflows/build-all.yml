name: Build every Minecraft version
on:
  workflow_dispatch:
  push:
    branches: [multi-mc-versions]
    paths:
      - '.github/workflows/build-all.yml'
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
jobs:
  build:
    name: "Fabric ${{ matrix.mc }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mc: "1.21.8", api: "0.136.1+1.21.8", java: 21}
          - {mc: "1.21.9", api: "0.134.1+1.21.9", java: 21}
          - {mc: "1.21.10", api: "0.138.4+1.21.10", java: 21}
          - {mc: "1.21.11", api: "0.141.3+1.21.11", java: 21}
          - {mc: "26.1", api: "0.145.1+26.1", java: 25}
          - {mc: "26.1.1", api: "0.145.4+26.1.1", java: 25}
          - {mc: "26.1.2", api: "0.155.3+26.1.2", java: 25}
          - {mc: "26.2", api: "0.161.0+26.2", java: 25}
          - {mc: "26.3", api: "0.161.0+26.3", java: 25}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Prepare legacy Minecraft mappings
        if: matrix.java == 21
        run: |
          sed -i "s/net.fabricmc.fabric-loom'/net.fabricmc.fabric-loom-remap'/" build.gradle
          sed -i 's/    implementation "net.fabricmc:fabric-loader/    modImplementation "net.fabricmc:fabric-loader/' build.gradle
          sed -i 's/    implementation "net.fabricmc.fabric-api:fabric-api/    modImplementation "net.fabricmc.fabric-api:fabric-api/' build.gradle
          sed -i '/    minecraft "com.mojang:minecraft:/a\    mappings loom.officialMojangMappings()' build.gradle
      - name: Build Fabric client
        run: gradle build --no-daemon -Pminecraft_version=${{ matrix.mc }} '-Pfabric_api_version=${{ matrix.api }}' -PtargetJava=${{ matrix.java }}
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: corz-client-fabric-${{ matrix.mc }}
          path: build/libs/*.jar
          if-no-files-found: error
