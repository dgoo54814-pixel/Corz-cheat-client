name: Fabric Multi-Version Build
on:
  workflow_dispatch:
  push:
    branches: [multi-mc-versions]
    paths:
      - '.github/workflows/multiversion.yml'
      - 'src/**'
      - 'compat/**'
      - 'build.gradle'
      - 'gradle.properties'
jobs:
  build:
    name: "Minecraft ${{ matrix.mc }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mc: '1.21.8', api: '0.136.1+1.21.8', java: 21}
          - {mc: '1.21.9', api: '0.134.1+1.21.9', java: 21}
          - {mc: '1.21.10', api: '0.138.4+1.21.10', java: 21}
          - {mc: '1.21.11', api: '0.141.6+1.21.11', java: 21}
          - {mc: '26.1', api: '0.145.1+26.1', java: 25}
          - {mc: '26.1.1', api: '0.145.4+26.1.1', java: 25}
          - {mc: '26.1.2', api: '0.155.3+26.1.2', java: 25}
          - {mc: '26.2', api: '0.161.0+26.2', java: 25}
          - {mc: '26.3', api: '0.162.0+26.3', java: 25}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Adjust sources and mappings for game version
        shell: bash
        env:
          MC: ${{ matrix.mc }}
          JDK: ${{ matrix.java }}
        run: |
          set -euo pipefail
          sed -i "s/\"minecraft\": \"26.1.2\"/\"minecraft\": \"$MC\"/" src/main/resources/fabric.mod.json
          sed -i "s/\"java\": \">=25\"/\"java\": \">=$JDK\"/" src/main/resources/fabric.mod.json
          if [ "$JDK" = "21" ]; then
            sed -i "s/net.fabricmc.fabric-loom'/net.fabricmc.fabric-loom-remap'/" build.gradle
            sed -i '/    minecraft "com.mojang:minecraft:/a\    mappings loom.officialMojangMappings()' build.gradle
            sed -i 's/    implementation "net.fabricmc:/    modImplementation "net.fabricmc:/g' build.gradle
            sed -i 's/JavaVersion.VERSION_25/JavaVersion.VERSION_21/g; s/options.release = 25/options.release = 21/g' build.gradle
            MC="$MC" python3 compat/patch_legacy.py
          fi
          if [ "$MC" = "26.2" ] || [ "$MC" = "26.3" ]; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          version=os.environ["MC"]
          for p in Path("src/client/java").rglob("*.java"):
              s=p.read_text()
              s=s.replace("mc.screen", "mc.gui.screen()")
              s=s.replace("minecraft.setScreen(", "minecraft.gui.setScreen(")
              s=s.replace("mc.setScreen(", "mc.gui.setScreen(")
              if version=="26.3":
                  s=s.replace("InputConstants.Type.KEYSYM", "InputConstants.Type.KEYBOARD")
                  s=s.replace("mc.player.swing(InteractionHand.MAIN_HAND)", "mc.player.swing(InteractionHand.MAIN_HAND, net.minecraft.world.item.component.SwingAnimation.DEFAULT, true)")
              p.write_text(s)
          PY
          fi
      - name: Compile Fabric mod
        run: gradle build --no-daemon -Pminecraft_version=${{ matrix.mc }} -Pfabric_api_version=${{ matrix.api }}
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: corz-client-${{ matrix.mc }}
          path: build/libs/*.jar
          if-no-files-found: error
