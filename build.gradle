plugins {
    id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
}

version = project.mod_version + '-' + project.minecraft_version + '-' + project.minecraft_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        corzstyle {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

java {
    sourceCompatibility = JavaVersion.toVersion(project.hasProperty('targetJava') ? project.targetJava : 25)
    targetCompatibility = JavaVersion.toVersion(project.hasProperty('targetJava') ? project.targetJava : 25)
}

tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(project.hasProperty('targetJava') ? project.targetJava.toString() : '25')
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version, 'mc_version': project.minecraft_version, 'java_version': project.hasProperty('targetJava') ? project.targetJava : '25' }
}
